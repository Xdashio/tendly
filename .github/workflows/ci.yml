name: CI

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]

jobs:
  lint-markdown:
    name: Lint documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for broken relative links in docs
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          config-file: '.github/mlc_config.json'

      - name: Confirm core docs exist
        run: |
          test -f docs/PROBLEM_STATEMENT.md
          test -f docs/ARCHITECTURE.md
          test -f docs/LICENSE_DECISION.md
          test -f docs/ROADMAP.md
          test -f docs/DECISIONS.md
          test -f docs/DEVELOPMENT.md
          test -f LICENSE
          test -f CONTRIBUTING.md
          test -f CODE_OF_CONDUCT.md
          echo "All required project docs present."

  frontend:
    name: Frontend checks and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Svelte & TypeScript check
        run: npm run check

      - name: Run Vitest unit tests
        run: npm test

      - name: Run Vite production build
        run: npm run build

  rust:
    name: Rust checks and foundation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check Rust formatting
        run: |
          cd src-tauri
          cargo fmt --all -- --check

      - name: Check Rust clippy lints
        run: |
          cd src-tauri
          cargo clippy --all-targets -- -D warnings

      - name: Run Rust unit & integration tests
        run: |
          cd src-tauri
          cargo test --verbose
